<body> <div id="head"><header>Number Guessing Game</header></div>

    <h1 id="headline">Rate die Zahl!</h1>
    <h2 id="displayTries">Versuche: </h2>
    <div class="game-container"> 
        <form onsubmit="guessTheNumber(); return false;">
            <input id="guess" type="number"  placeholder="Deine Zahl hier..." required> 
            <button>Guess</button>
        </form>
        
    </div>
